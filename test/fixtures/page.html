<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2F test page</title>
<style>
  body { margin: 0; font-family: Georgia, serif; background: #eef1f7; color: #111; }
  .outside { padding: 20px; background: #222; color: #fff; }
  #hero { width: 600px; margin: 80px 80px 40px; padding: 40px; border-radius: 16px;
    background-image: linear-gradient(90deg, #fee, #eef), linear-gradient(0deg, #efe, #ffe); }
  #hero::before { content: "Before"; display: block; font-size: 12px; }
  h1 { margin: 0 0 12px; font-size: 40px; line-height: 1.1; }
  p { margin: 0; font-size: 18px; line-height: 1.5; }
  .cards { display: flex; gap: 20px; margin: 0 80px; }
  .card { flex: 1; padding: 24px; background: #fff; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.12); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 80px; }
  .grid div { padding: 16px; background: #fff; border: 1px solid #ccd; }
  .tall { height: 1400px; margin: 40px 80px; background: #dfe6ff; }
</style>
</head>
<body>
<header class="outside">Outside header</header>
<section id="hero">
  <h1>Hero title</h1>
  <p>Hero text that is long enough to wrap on several lines inside the selected block.</p>
  <svg width="40" height="40" viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" fill="#4d8dff"/></svg>
</section>
<section id="cards" class="cards">
  <div class="card">Card one</div>
  <div class="card">Card two</div>
</section>
<section class="grid" id="grid"><div>Grid one</div><div>Grid two</div></section>
<div class="tall">Tall section</div>
</body>
</html>
