<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>S2F font names</title>
<style>
  body { margin: 20px; font-size: 18px; }
  p { margin: 0 0 8px; }
</style>
</head>
<body>
<!-- No font files of its own: every family here is resolved by the capture. -->
<p style="font-family: system-ui; font-weight: 600">SystemSemi text</p>
<p style="font-family: sans-serif; font-weight: 800">SansExtra text</p>
<p style="font-family: montserrat; font-weight: 600">LowerMont text</p>
<p style="font-family: 'Montserrat-Bold'">AliasMont text</p>
<p style="font-family: '__Open_Sans_a1b2c3', '__Open_Sans_Fallback_a1b2c3'">NextOpen text</p>
<p style="font-family: 'Gilroy-SemiBold'">GilroySemi text</p>
<p id="helv" style="font-family: 'HelveticaNeue-Bold', Arial, sans-serif">HelvBold text</p>
<p style="font-family: 'Archivo Black'">ArchivoBlack text</p>
<p style="font-family: Georgia; font-size: 20px; line-height: 1.5">RawLine text</p>
<p style="font-family: Georgia; font-size: 20px; line-height: 30px">PixelLine text</p>
<p style="font-family: Georgia; font-size: 20px; line-height: normal">NormalLine text</p>
</body>
</html>
